services:
  liquordb-app:
    build: .
    image: liquordb-app:latest
    container_name: liquordb-app
    ports:
      - "80:8080"  # EC2 80 -> Spring 8080
    restart: always # 컨테이너 자동 재실행
    networks:
      - liquordb-network # 없어도 기본 네트워크로 잘 돌아가긴 함.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env.prod

  mysql:
    image: mysql:8.0
    container_name: mysql
    networks:
      - liquordb-network
    environment:
      TZ: Asia/Seoul
    env_file:
      - .env.prod
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # --- In-Memory DB (Redis) ---
  redis:
    image: redis:7.2-alpine
    container_name: liquordb-redis
    networks:
      - liquordb-network
    command: redis-server --appendonly yes
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  liquordb-network:
    driver: bridge

volumes:
  mysql_data:
