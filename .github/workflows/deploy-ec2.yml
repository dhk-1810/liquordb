name: Deploy to EC2 and S3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get GitHub Actions runner IP
        id: ip
        run: |
          echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Allow runner IP in EC2 Security Group
        env:
          EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
        run: |
          if [ -n "$EC2_SECURITY_GROUP_ID" ]; then
            aws ec2 authorize-security-group-ingress \
              --group-id "$EC2_SECURITY_GROUP_ID" \
              --protocol tcp \
              --port ${{ secrets.EC2_PORT || 22 }} \
              --cidr "${{ steps.ip.outputs.ipv4 }}/32"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t liquordb-app:latest .

      - name: Save Docker image to tar.gz
        run: |
          docker save liquordb-app:latest | gzip > liquordb-app.tar.gz

      - name: Copy files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: "liquordb-app.tar.gz,docker-compose.light.yml"
          target: "/app"

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd /app
            gunzip -c liquordb-app.tar.gz | docker load
            rm -f liquordb-app.tar.gz
            docker compose -f docker-compose.light.yml up -d
            docker image prune -f

      - name: Revoke runner IP from EC2 Security Group
        if: always()
        env:
          EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
        run: |
          if [ -n "$EC2_SECURITY_GROUP_ID" ] && [ -n "${{ steps.ip.outputs.ipv4 }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "$EC2_SECURITY_GROUP_ID" \
              --protocol tcp \
              --port ${{ secrets.EC2_PORT || 22 }} \
              --cidr "${{ steps.ip.outputs.ipv4 }}/32" || true
          fi

  deploy-frontend:
    name: Deploy Frontend to S3 & CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync static files to S3 (replace & delete old files)
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID secret is not set. Skipping cache invalidation."
          fi
