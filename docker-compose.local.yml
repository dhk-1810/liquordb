# 로컬 테스트용 docker-compose임. 배포할 땐(ECS) 사용되지 않음.
# up: docker-compose -f docker-compose.local.yml up -d
# down: docker-compose -f docker-compose.local.yml down
# Caused by: java.sql.SQLException: Access denied for user 'root'@'172.18.0.5' (using password: YES)
services:
  app-1:
    build: .
    image: liquordb-app:latest
    networks:
      - liquordb-network
    env_file:
      - .env.local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # --- Backend 2 (Spring Boot) ---
  app-2:
    build: .
    image: liquordb-app:latest
    networks:
      - liquordb-network
    env_file:
      - .env.local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # --- Infrastructure ---
  mysql:
    image: mysql:8.0
    networks:
      liquordb-network:
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    env_file:
      - .env.local
    volumes:
      - mysql_data:/var/lib/mysql # 데이터 영속성 보장
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    networks:
      - liquordb-network
    command: redis-server --appendonly yes # 실행 명령 - 데이터 변경시 디스크에 로그 낭김
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Nginx Load Balancer ---
  nginx:
    image: nginx:alpine
    #    build: ./nginx
    ports:
      - "80:80"
    networks:
      - liquordb-network
    depends_on:
      - app-1
      - app-2
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf

networks:
  liquordb-network:
    driver: bridge

volumes:
  mysql_data: