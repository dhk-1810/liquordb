# 최소 비용 배포(EC2)를 위한 docker-compose임.
# up: docker-compose -f docker-compose.light.yml up -d
# down: docker-compose -f docker-compose.light.yml down

services:
  liquordb-app:
    build: .
    image: liquordb-app:latest
    ports:
      - "80:8080"  # EC2 80 -> Spring 8080
    networks:
      - liquordb-network # 없어도 기본 네트워크로 잘 돌아가긴 함.
    env_file:
      - .env.light
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always # 컨테이너 자동 재실행

  mysql:
    image: mysql:8.0
    networks:
      - liquordb-network
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    env_file:
      - .env.light
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # --- In-Memory DB (Redis) ---
  redis:
    image: redis:7.2-alpine
    networks:
      - liquordb-network
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

networks:
  liquordb-network:
    driver: bridge

volumes:
  mysql_data:
